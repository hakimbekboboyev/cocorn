<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoCorn Annotation</title>
  <link rel="stylesheet" href="annotation.css">
</head>
<body>
  <!-- Fullscreen Drawing Canvas -->
  <canvas id="drawCanvas"></canvas>

  <!-- Floating Drawing Tools Dock -->
  <div class="annotation-dock" id="annotationDock">
    <!-- Tools -->
    <div class="tool-group">
      <button class="tool-btn active" data-tool="pen" title="Qalam (Pen)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
        </svg>
      </button>

      <button class="tool-btn" data-tool="arrow" title="Strelka (Arrow)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <button class="tool-btn" data-tool="rect" title="To'rtburchak (Rectangle)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        </svg>
      </button>

      <button class="tool-btn" data-tool="circle" title="Aylana (Circle)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="9"></circle>
        </svg>
      </button>

      <button class="tool-btn" data-tool="highlighter" title="Marker (Highlighter)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 11-6 6v3h3l6-6"/>
          <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>
        </svg>
      </button>
    </div>

    <div class="dock-divider"></div>

    <!-- Colors -->
    <div class="color-group">
      <button class="color-btn active" data-color="#ef4444" style="--c: #ef4444;" title="Qizil"></button>
      <button class="color-btn" data-color="#f59e0b" style="--c: #f59e0b;" title="Sariq"></button>
      <button class="color-btn" data-color="#10b981" style="--c: #10b981;" title="Yashil"></button>
      <button class="color-btn" data-color="#3b82f6" style="--c: #3b82f6;" title="Moviy"></button>
      <button class="color-btn" data-color="#a855f7" style="--c: #a855f7;" title="Binafsha"></button>
      <button class="color-btn" data-color="#ffffff" style="--c: #ffffff;" title="Oq"></button>
    </div>

    <div class="dock-divider"></div>

    <!-- Stroke Sizes -->
    <div class="size-group">
      <button class="size-btn" data-size="3" title="Yupqa (3px)">
        <span style="width: 5px; height: 5px;"></span>
      </button>
      <button class="size-btn active" data-size="6" title="O'rtacha (6px)">
        <span style="width: 8px; height: 8px;"></span>
      </button>
      <button class="size-btn" data-size="12" title="Qalin (12px)">
        <span style="width: 12px; height: 12px;"></span>
      </button>
    </div>

    <div class="dock-divider"></div>

    <!-- Actions -->
    <div class="action-group">
      <button class="act-btn" id="undoBtn" title="Orqaga (Undo)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>

      <button class="act-btn" id="clearBtn" title="Tozalash (Clear)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>

      <button class="act-btn close-btn" id="closeAnnotationBtn" title="Yopish (Esc)">
        ✕
      </button>
    </div>
  </div>

  <script src="annotation.js"></script>
</body>
</html>
